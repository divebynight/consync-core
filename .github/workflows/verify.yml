name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Core verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ScaffoldAI verification
        run: npm run verify:scaffoldai

      - name: Run unit and integration tests
        run: npm test

  e2e:
    name: Renderer E2E (manual only)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Only runs when manually triggered via workflow_dispatch.
    # Not required for PRs. Trigger manually when validating renderer/Electron changes.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run renderer E2E tests
        run: npm run test:e2e
